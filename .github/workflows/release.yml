name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

# Needed for `gh release create` to create/update a Release with the default GITHUB_TOKEN.
permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # `secrets` isn't allowed inside `if:` conditionals, so resolve it to a
      # plain env var here and branch on that instead below.
      HAS_RELEASE_SIGNING_SECRETS: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Decode release keystore
        if: ${{ env.HAS_RELEASE_SIGNING_SECRETS == 'true' }}
        run: echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/release.keystore"

      # Signed build: only runs once the four RELEASE_* secrets described in
      # README.md are configured. Without them this step is skipped and the
      # fallback below runs instead, so a release can still go out — just
      # debug-signed until the signing secrets are added.
      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_SIGNING_SECRETS == 'true' }}
        env:
          RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/release.keystore
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Build fallback debug APK (no signing secrets configured yet)
        if: ${{ env.HAS_RELEASE_SIGNING_SECRETS != 'true' }}
        run: |
          echo "::warning::RELEASE_KEYSTORE_BASE64 isn't set, so this release is debug-signed instead of using a stable release key. See README.md's Release section to add the signing secrets."
          gradle assembleDebug --stacktrace

      - name: Stage the APK for upload
        id: apk
        run: |
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            src=app/build/outputs/apk/release/app-release.apk
          else
            src=app/build/outputs/apk/debug/app-debug.apk
          fi
          dest="DuoFlow-${GITHUB_REF_NAME}.apk"
          cp "$src" "$dest"
          echo "path=$dest" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete "$GITHUB_REF_NAME" --yes || true
          gh release create "$GITHUB_REF_NAME" "${{ steps.apk.outputs.path }}" \
            --title "DuoFlow $GITHUB_REF_NAME" \
            --generate-notes
